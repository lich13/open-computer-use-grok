name: Sync upstream

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync one upstream revision and npm release
        run: node scripts/sync-upstream.mjs
      - name: Validate before publishing
        run: node --test
      - name: Commit changed content
        run: |
          git add open-computer-use .claude-plugin/marketplace.json .grok-plugin/marketplace.json
          if git diff --cached --quiet; then
            echo "Upstream content unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version="$(node -p 'require("./open-computer-use/.claude-plugin/plugin.json").version')"
          git commit -m "chore: sync upstream and release plugin ${version}"
          git push
